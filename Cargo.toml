[package]
name = "gogit"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
gix = { version = "0.66" } # Using a recent version for gitoxide
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
thiserror = "2.0"
edit = "0.1"
async-stream = "0.3"
octocrab = "0.38"
dialoguer = "0.11"
dirs = "5.0"
toml = "0.8"
indicatif = "0.17"
rascii_art = "0.4.5"
viuer = { version = "0.11", features = ["print-file"] }

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Better optimizations
panic = "abort"    # Reduce binary size by removing unwinding info
strip = true        # Strip symbols from the binary
