name: Linux Build And Release

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  BINARY_NAME: gogit
  RUST_VERSION: "1.88.0"

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare release bundle
        run: |
          mkdir -p dist
          cp target/release/${BINARY_NAME} dist/${BINARY_NAME}
          cp target/release/${BINARY_NAME} ./${BINARY_NAME}-linux-x86_64-${GITHUB_REF_NAME}
          cp README.md dist/README.md
          if [ -f install.sh ]; then cp install.sh dist/install.sh; fi
          tar -C dist -czf ${BINARY_NAME}-linux-x86_64-${GITHUB_REF_NAME}.tar.gz .
          sha256sum ${BINARY_NAME}-linux-x86_64-${GITHUB_REF_NAME}.tar.gz > ${BINARY_NAME}-linux-x86_64-${GITHUB_REF_NAME}.sha256
          sha256sum ${BINARY_NAME}-linux-x86_64-${GITHUB_REF_NAME} > ${BINARY_NAME}-linux-x86_64-${GITHUB_REF_NAME}.bin.sha256

      - name: Upload Linux bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: gogit-linux-x86_64
          path: |
            gogit-linux-x86_64-${{ github.ref_name }}
            gogit-linux-x86_64-${{ github.ref_name }}.bin.sha256
            gogit-linux-x86_64-${{ github.ref_name }}.tar.gz
            gogit-linux-x86_64-${{ github.ref_name }}.sha256
          if-no-files-found: error

  release-linux:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Linux bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: gogit-linux-x86_64

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gogit-linux-x86_64-${{ github.ref_name }}
            gogit-linux-x86_64-${{ github.ref_name }}.bin.sha256
            gogit-linux-x86_64-${{ github.ref_name }}.tar.gz
            gogit-linux-x86_64-${{ github.ref_name }}.sha256
          generate_release_notes: true
